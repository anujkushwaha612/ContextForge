# ─────────────────────────────────────────────────────────────────────
# ContextForge Configuration — EXAMPLE
# ─────────────────────────────────────────────────────────────────────

[proxy]
# Port the ContextForge proxy listens on. 0 = auto-pick a free port.
port = 3000

# "full"        = complete pipeline: compression, dedup, graph tools, memory
# "passthrough" = translate + forward only (use for debugging/benchmarking)
mode = "full"

[provider]
# The UPSTREAM provider where requests are SENT.
#   ollama | openai | anthropic | groq | gemini
name = "ollama"

# Model name sent to the upstream provider.
# REQUIRED for ollama. For anthropic, leave unset.
model_override = "qwen2.5-coder:14b"

[compression]
# Recommended: true. Strips native Edit/Read/Update tools so the model 
# uses ContextForge's graph-aware tools exclusively.
nudge_tools = true

[logging]
# Set to true to write detailed proxy logs to ~/.contextforge/logs/
file = false