# ─────────────────────────────────────────────────────────────────────
# ContextForge configuration — EXAMPLE
#
# NOTE: ContextForge uses TOML, not YAML. Two config locations:
#
#   Global   (per machine):  ~/.contextforge/config.toml
#                            (Windows: %APPDATA%\contextforge\config.toml)
#                            Created by the first-run wizard (`cf setup`).
#
#   Project  (per repo):     ./.contextforge.toml
#                            Created by `cf init`. Overrides global.
#                            SAFE TO COMMIT — teammates get the same setup.
#
# Precedence (highest wins):
#   CLI flags  >  CF_* env vars  >  ./.contextforge.toml  >  global  >  defaults
#
# See every resolved value and where it came from:   cf config
# Change a value without editing files:               cf config set <key> <value>
#
# To use this file: copy to .contextforge.toml and edit.
# ─────────────────────────────────────────────────────────────────────

[proxy]
# Port the ContextForge proxy listens on. 0 = auto-pick a free port.
port = 3000

# "full"        = complete pipeline: compression, dedup, graph tools, memory
# "passthrough" = translate + forward only (debugging / benchmarking baseline)
mode = "full"

[provider]
# The UPSTREAM provider — where requests are SENT (not where they come from).
# Claude Code always talks to the proxy in Anthropic format; the proxy
# translates to this provider's format.
#   ollama | openai | anthropic | groq | gemini
name = "ollama"

# Model override sent upstream.
#   REQUIRED for ollama (it has no default model) — local or cloud tags work:
#     "qwen2.5-coder:14b"     (local)
#     "minimax-m3:cloud"      (ollama cloud)
#   For anthropic: leave unset — Claude Code picks its model via /model.
model_override = "qwen2.5-coder:14b"

[compression]
# Cognitive Context Routing — background tool-hop interception.
ccr = true

# Strip Claude Code's native Edit/Read/Update tools so the model uses
# ContextForge's graph-aware tools exclusively. Recommended: true.
# (Native Write stays available — it's used for new-file creation.)
nudge_tools = true
